[package]
name = "azura-dock"
version = "0.1.0"
edition = "2024"

[dependencies]
cxx = "1.0.197"
cxx-qt = "0.9.1"
cxx-qt-lib = { version = "0.9.1", features = ["qt_gui", "qt_qml"] }
directories = "6.0.0"
freedesktop-desktop-entry = "0.8.3"
freedesktop-icons = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[build-dependencies]
cxx-qt-build = "0.9.1"
